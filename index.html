<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Prueba Radio Max FM</title>
        <style>
            body {
                font-family: sans-serif;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                background-color: #f0f2f5;
            }
            .card {
                background: white;
                padding: 2rem;
                border-radius: 15px;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
                text-align: center;
            }
            h1 {
                color: #e91e63;
            }
            audio {
                margin-top: 20px;
                width: 300px;
            }
        </style>
    </head>
    <body>
        <div class="card">
            <h1>📻 Max FM Test</h1>
            <p>
                Estado:
                <strong>En directo</strong>
            </p>

            <audio controls autoplay>
                <source src="https://server2.ejeserver.com:7009/stream" type="audio/mpeg" />
                Tu navegador no soporta el elemento de audio.
            </audio>

            <p style="font-size: 0.8rem; color: #666; margin-top: 20px">
                URL: https://server2.ejeserver.com:7009/stream
            </p>
        </div>
    </body>
</html>
